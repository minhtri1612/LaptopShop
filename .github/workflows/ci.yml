name: ci

on:
  pull_request:
    paths:
      - src/**
      - public/**
      - prisma/**
      - terraform/**
      - Dockerfile
      - docker-compose.yml
      - package.json
      - package-lock.json
      - tsconfig.json
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - prisma/**
      - terraform/**
      - Dockerfile
      - docker-compose.yml
      - package.json
      - package-lock.json
      - tsconfig.json
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        type: choice
        options:
          - plan
          - apply
          - destroy
        required: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
      terraform: ${{ steps.diff.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "$files"
          app=false
          terraform=false
          if echo "$files" | grep -Eq '^(src/|public/|prisma/|package\.json$|package-lock\.json$|tsconfig\.json$|Dockerfile$|docker-compose\.yml$)'; then
            app=true
          fi
          if echo "$files" | grep -Eq '^terraform/'; then
            terraform=true
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "terraform=$terraform" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: >
      needs.changes.outputs.app == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.action != 'destroy')
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: nodejspro
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:test@127.0.0.1:3306/nodejspro
      SESSION_SECRET: test-secret-not-for-prod
      JWT_SECRET: test-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test

  terraform-plan:
    needs: changes
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       needs.changes.outputs.terraform == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=ap-southeast-2"
      - name: Terraform plan
        run: terraform plan -input=false -var-file=terraform.tfvars.example -no-color

  terraform-apply:
    needs: [changes, test]
    if: >
      !cancelled() &&
      needs.changes.outputs.terraform == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=ap-southeast-2"
      - name: Terraform plan
        run: terraform plan -input=false -var-file=terraform.tfvars.example -out=tfplan -no-color
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

  terraform-destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=ap-southeast-2"
      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve -var-file=terraform.tfvars.example -no-color

  deploy:
    needs: [changes, test, terraform-apply]
    if: >
      !cancelled() &&
      needs.changes.outputs.app == 'true' &&
      needs.test.result == 'success' &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-southeast-2
      ECR_REPOSITORY: laptopshop-prod
      ECS_CLUSTER: laptopshop-prod
      ECS_SERVICE: laptopshop-prod
      CONTAINER_NAME: app
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"
      - name: Deploy to ECS
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_SERVICE" \
            --query taskDefinition \
            > task-definition.json
          jq --arg IMAGE "$IMAGE" --arg NAME "$CONTAINER_NAME" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                if .name == $NAME then
                  .image = $IMAGE
                  | .secrets = (
                      .secrets
                      | if any(.name == "DATABASE_REPLICA_URL") then .
                        else . + [{
                          name: "DATABASE_REPLICA_URL",
                          valueFrom: (map(select(.name == "DATABASE_URL"))[0].valueFrom | sub(":DATABASE_URL::"; ":DATABASE_REPLICA_URL::"))
                        }]
                        end
                    )
                else .
                end
              )
          ' task-definition.json > new-task-definition.json
          arn=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$arn" >/dev/null
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
