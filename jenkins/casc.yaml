jenkins:
  systemMessage: "LaptopShop — local CI (EC2 deploy skipped)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: LOCAL_CI
            value: "true"
          - key: SKIP_AWS
            value: "true"
          - key: SONAR_HOST_URL
            value: "sonarqube:9000"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              secret: "${SONAR_TOKEN}"
              description: "Local SonarQube token"

unclassified:
  location:
    url: http://localhost:8081/
    adminAddress: admin@localhost.local

tool:
  nodejs:
    installations:
      - name: "18"
        home: "/usr/local"
  sonarRunnerInstallation:
    installations:
      - name: "SonarQubeScanner"
        home: "/opt/sonar-scanner"

jobs:
  - script: |
      pipelineJob('laptopshop') {
        displayName('LaptopShop')
        definition {
          cps {
            sandbox()
            script(new File('/workspace/Jenkinsfile').text)
          }
        }
      }
