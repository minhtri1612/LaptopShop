services:
  sonar_db:
    image: postgres:15-alpine
    container_name: laptopshop-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:lts-community
    container_name: laptopshop-sonarqube
    restart: unless-stopped
    depends_on:
      sonar_db:
        condition: service_healthy
    ports:
      - "9001:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: laptopshop-jenkins
    restart: unless-stopped
    depends_on:
      - sonarqube
    ports:
      - "8081:8080"
      - "50001:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true -Xmx1024m"
      CASC_JENKINS_CONFIG: /casc/jenkins.yaml
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      LOCAL_CI: "true"
      SKIP_AWS: "true"
      SONAR_HOST_URL: sonarqube:9000
      PROJECT_DIR: ${PWD}
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/casc.yaml:/casc/jenkins.yaml:ro
      - ${PWD}:${PWD}
      - ${PWD}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  sonar_db_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  jenkins_home:
